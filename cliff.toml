[changelog]
header = """
# Rascunho de changelog

Gerado a partir dos commits. **Não é o changelog final** — serve como lista do que não pode faltar.
As entradas abaixo descrevem o que o desenvolvedor fez; o `CHANGELOG.md` descreve o que mudou para
quem usa o sistema. Reescreva antes de publicar.

"""

body = """
{% if version %}## {{ version }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}## Não publicado
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
filter_commits = true
topo_order = false
sort_commits = "oldest"

commit_parsers = [
  { message = "^feat", group = "Adicionado" },
  { message = "^fix", group = "Corrigido" },
  { message = "^perf", group = "Alterado" },
  { message = "^refactor", group = "Alterado" },
  { message = "^revert", group = "Removido" },
  { body = ".*[Ss]ecurity", group = "Segurança" },
  { message = "^chore\\(deps\\)", group = "Segurança" },
  { message = "^docs", skip = true },
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
  { message = "^style", skip = true },
  { message = "^chore", skip = true },
]
